[project]
name = "cerberus-scan-mcp"
version = "0.1.0"
description = "Security-scanning MCP server: runs open-source scanners and guides an AI agent through vulnerability triage and runtime validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0,<2",
]

[project.scripts]
cerberus-scan-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Rebuild local uvx installations when server code or bundled guidance changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "mcp_server/**/*.py" },
    { file = "mcp_server/**/*.yml" },
    { file = "mcp_server/**/*.yaml" },
    { file = "mcp_server/scanner_image/Dockerfile" },
    { file = "methodology/**/*.md" },
]

[tool.hatch.build.targets.wheel]
# mcp_server/ ships as the package — including its in-package data files
# (scanner_image/*, docker-compose.yml), which hatchling picks up automatically.
# methodology/ lives at the repo root (with its stacks/ subfolder), so
# force-include copies it into the package on build, next to the code that
# resolves it.
packages = ["mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"methodology" = "mcp_server/methodology"
